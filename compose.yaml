name: localinterfaceweb

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-photo_service}
      POSTGRES_USER: ${POSTGRES_USER:-photo_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run start.cmd or sh start.sh first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    init: true
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run start.cmd or sh start.sh first}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-0}
      DJANGO_MEDIA_ROOT: /app/media
      DJANGO_STATIC_ROOT: /app/staticfiles
      POSTGRES_DB: ${POSTGRES_DB:-photo_service}
      POSTGRES_USER: ${POSTGRES_USER:-photo_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run start.cmd or sh start.sh first}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run start.cmd or sh start.sh first}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/api/health/]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4:9
    profiles: [tools]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Run start.cmd or sh start.sh first}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, /venv/bin/python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1/misc/ping', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  postgres_data:
  media_data:
  static_data:
  pgadmin_data:
